[workspace]
resolver = "2"
members = [
    "crates/sekai-profile-renderer",
    "crates/sekai-profile-renderer-core",
    "crates/sekai-profile-renderer-host",
    "crates/sekai-profile-card-cli",
    "crates/allium-renderer-wasm",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/empty-sekai/sekai-custom-profile-sdk"

[workspace.dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
