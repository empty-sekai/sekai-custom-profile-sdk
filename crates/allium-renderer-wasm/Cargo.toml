[package]
name = "allium-renderer-wasm"
version.workspace = true
edition.workspace = true
description = "Project SEKAI profile scene and minimal FreeType runtime for the WebGL2 renderer"
license.workspace = true
repository.workspace = true
# Shipped as the npm package, not a registry crate.
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "allium_renderer_wasm"
path = "src/main.rs"

[dependencies]
sekai-profile-renderer-core = { path = "../sekai-profile-renderer-core" }
base64 = "0.22"
freetype-rs = "0.38"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
web-time = "1"
