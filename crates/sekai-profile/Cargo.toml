[package]
name = "sekai-profile"
version.workspace = true
edition.workspace = true
description = "Custom profile card rendering engine: TextMesh Pro-compatible layout, SDF text and shape rasterization, and a dependency-free CPU compositor"
license.workspace = true
repository.workspace = true

[dependencies]
sekai-profile-core = { path = "../sekai-profile-core", version = "0.7.0", features = ["freetype"] }
arc-swap = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
lru = "0.12"
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
rayon = { version = "1.11", optional = true }
# The text engine: glyph outlines, metrics and SDF generation. Independent of
# any raster backend.
freetype-rs = { version = "0.38" }
ttf-parser = { version = "0.25" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
gif = { version = "0.14.1", optional = true }
color_quant = { version = "1.1.0", optional = true }
crc32fast = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
webp-animation = { version = "0.10.0", features = ["static"], optional = true }
turbojpeg-sys = { version = "1.2", default-features = false, features = ["cmake"], optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[package.metadata.docs.rs]
features = ["jpeg-turbo"]

[features]
default = []
# Bundled FreeType C sources for hosts without pkg-config.
bundled-freetype = ["freetype-rs/bundled"]
# Vendored libjpeg-turbo plus the raw-YUV encoder used by profile backends.
jpeg-turbo = ["dep:turbojpeg-sys"]
# Dedicated rayon raster pool. Disabling it preserves byte-identical serial output.
parallel = ["dep:rayon"]
# Animation encoders. Layer rasterization runs through the ordered SDF path
# selected by the profile backend config.
animation-export = ["dep:gif", "dep:color_quant", "dep:crc32fast", "dep:flate2", "dep:webp-animation"]
# Diagnostics for the SDF generators (`compare_sdf`).
dev = ["dep:tracing-subscriber"]

[[example]]
name = "compare_sdf"
required-features = ["dev"]

[[bin]]
name = "dump-outline-sdf"
path = "tools/dump_outline_sdf.rs"

[[bin]]
name = "build-sdf-atlas"
path = "tools/build_sdf_atlas.rs"

[[bin]]
name = "build-shape-sdf-atlas"
path = "tools/build_shape_sdf_atlas.rs"

[[bin]]
name = "build-render-object-store"
path = "tools/build_render_object_store.rs"

[[example]]
name = "ordered_pages"

[[example]]
name = "animation_export"
required-features = ["animation-export"]

