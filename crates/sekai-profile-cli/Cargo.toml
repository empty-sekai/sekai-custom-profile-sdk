[package]
name = "sekai-profile-cli"
version.workspace = true
edition.workspace = true
description = "sekai-profile: renders Project SEKAI custom profile cards and prepares the atlases the renderer samples"
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "sekai-profile"
path = "src/main.rs"

[features]
# JPEG output needs `jpeg-turbo`; PNG output needs no feature.
default = ["jpeg-turbo"]
jpeg-turbo = ["sekai-profile/jpeg-turbo"]

[dependencies]
sekai-profile = { path = "../sekai-profile", version = "0.7.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
# Synchronous HTTP for fetching masterdata/assets from a URL prefix.
# rustls TLS so https works without a system OpenSSL dependency.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
